[build]
  command = "npm run build"
  publish = "dist/angular-dip-hunter/browser"
  functions = "netlify/functions"

[functions]
  timeout = 26

[dev]
  command = "ng serve"
  targetPort = 4200
  port = 8888
  autoLaunch = false
  framework = "#custom"

# Route /api/quotes to the Netlify serverless function
[[redirects]]
  from = "/api/quotes"
  to = "/.netlify/functions/quotes"
  status = 200

# SPA fallback — all other routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
