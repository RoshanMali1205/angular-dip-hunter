<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in to Dip Hunter</title>
</head>
<body style="margin:0;padding:0;background:#0f172a;font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0f172a;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;background:#111827;border:1px solid #334155;border-radius:16px;overflow:hidden;">
          <tr>
            <td style="padding:28px 32px;background:linear-gradient(90deg,#059669,#0891b2);">
              <p style="margin:0;color:#ecfdf5;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;">Dip Hunter</p>
              <h1 style="margin:8px 0 0;color:#ffffff;font-size:22px;">Magic sign-in link</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 32px;color:#e2e8f0;font-size:15px;line-height:1.6;">
              <p style="margin:0 0 16px;">Use this one-time link to sign in to Dip Hunter{{ if .Email }} as {{ .Email }}{{ end }}.</p>
              <p style="margin:24px 0;text-align:center;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#10b981;color:#042f2e;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:10px;">Sign in</a>
              </p>
              <p style="margin:0;color:#94a3b8;font-size:13px;">If you did not request this, ignore the email.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
